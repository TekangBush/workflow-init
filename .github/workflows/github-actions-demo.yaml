name: GitHub Actions Demo
on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: hello world
        run: echo "Hello, world!"
  deploy:
    needs: build
    runs-on: ubuntu-latest
  
    steps:
      - name: Deploy to aks
        run: |
          echo "Deploying to AKS..."
          echo "Deploying to webapp."
  QA:
    needs: build
    runs-on: ubuntu-latest
  
    steps:
      - name: Deploy to qa
        run: |
          echo "Deploying to QA..."
          echo "Deploying to webapp."