name: Dev image build
on:
  push:
    branches:
      - development
  pull_request:
    branches:
      - development
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: hello world
        run: echo "Hello, world!"
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to aks
        run: |
          echo "Deploying to AKS..."
          echo "Deploying to webapp."
  QA:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to qa
        run: |
          echo "Deploying to QA..."
          echo "Deploying to webapp."
      - name: Agent's env
        run: |
          env | sort

  HelloLouis:
    needs: QA
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: HelloLouis
        shell: pwsh
        run: |
          .\dummy\helloLouis.ps1
          env | sort

  macbook:
    needs: deploy
    runs-on: macos-latest
    steps:
      - name: env
        run: |
          env | sort
